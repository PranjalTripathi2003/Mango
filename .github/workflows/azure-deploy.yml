        with:
          app-name: 'mangoservicescouponapipt'
          publish-profile: ${{ secrets.AZURE_COUPONAPI_PUBLISH_PROFILE }}
          package: ./publish/coupon

  # ----------------------------------------------------
  # 5. Mango.Services.ShoppingCartAPI
