      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mangoservicesproductapipt'
          publish-profile: ${{ secrets.AZURE_PRODUCTAPI_PUBLISH_PROFILE }}
          package: ./publish/product

  # ----------------------------------------------------
