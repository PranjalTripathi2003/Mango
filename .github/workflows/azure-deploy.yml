name: Build and Deploy All Microservices to Azure

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. Mango.GatewaySolution
  # ----------------------------------------------------
  deploy-gateway:
    name: Deploy Gateway
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Gateway
        run: dotnet publish Mango.GatewaySolution/Mango.GatewaySolution.csproj -c Release -o ./publish/gateway
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mangogatewaypt'
          publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
          package: ./publish/gateway

  # ----------------------------------------------------
  # 2. Mango.Services.AuthAPI
  # ----------------------------------------------------
  deploy-auth:
    name: Deploy AuthAPI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
