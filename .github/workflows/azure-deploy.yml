          dotnet-version: '8.0.x'
      - name: Publish AuthAPI
        run: dotnet publish Mango.Services.AuthAPI/Mango.Services.AuthAPI.csproj -c Release -o ./publish/auth
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mangoservicesauthapipt'
          publish-profile: ${{ secrets.AZURE_AUTHAPI_PUBLISH_PROFILE }}
          package: ./publish/auth

  # ----------------------------------------------------
  # 3. Mango.Services.ProductAPI
