# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - MangoServicesAuthAPIPT

on:
  push:
    branches:
      - master
    paths:
      - 'Mango.Services.AuthAPI/**'
      - 'Mango.MessageBus/**'
      - '.github/workflows/master_mangoservicesauthapipt.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Mango.Services.AuthAPI/Mango.Services.AuthAPI.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Mango.Services.AuthAPI/Mango.Services.AuthAPI.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CEB1A8C9BA1E461AB67EC54C92F02015 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BBEBD01C0C49426391D7DBC9650E8D3A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5303AA997C5D4B868FB959B70421D03D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MangoServicesAuthAPIPT'
          slot-name: 'Production'
          package: .
