# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - MangoServicesCouponAPIPT

on:
  push:
    branches:
      - master
    paths:
      - 'Mango.Services.CouponAPI/**'
      - '.github/workflows/master_mangoservicescouponapipt.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Mango.Services.CouponAPI/Mango.Services.CouponAPI.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Mango.Services.CouponAPI/Mango.Services.CouponAPI.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5E10E95C213D493690A60F6FEE3F2196 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DEAAC7B06C364D8B94FBF912A1F3CD2B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1EDD193FA28C428EB9DC545E0BEE07BE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MangoServicesCouponAPIPT'
          slot-name: 'Production'
          package: .
